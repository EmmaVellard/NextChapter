name: Verify Next Chapter

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # The deployed app is a static export served from a sub-path, so build it
    # that way here too. Without these, CI built a server app at the root and
    # never exercised the only configuration that actually ships.
    env:
      GITHUB_PAGES: 'true'
      NEXT_PUBLIC_BASE_PATH: '/NextChapter'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate app
        run: npm run quality

      - name: Verify static export
        run: npm run verify:export
